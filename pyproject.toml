[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "failure-aware-coding-agent"
version = "0.1.0"
description = "Evidence-grounded feedback for mini-SWE-agent coding tasks"
requires-python = ">=3.11"
dependencies = [
  "mini-swe-agent==2.4.6",
  "litellm==1.105.1",
  "httpx==0.28.1",
  "PyYAML>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
